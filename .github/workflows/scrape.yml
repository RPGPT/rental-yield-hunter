name: Scrape

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source"
        required: true
        default: "Imovirtual"
        type: choice
        options:
          - Imovirtual
      scraping_type:
        description: "Scraping type (leave empty to scrape both)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Buy"
          - "Rent"
      city:
        description: "City to scrape (leave empty to scrape all cities in parallel)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Porto"
          - "Matosinhos"
          - "Vila Nova de Gaia"
          - "Maia"

jobs:
  # ── Scrape: buy ──────────────────────────────────────────────────────────────
  scrape-buy:
    if: ${{ inputs.scraping_type == '' || inputs.scraping_type == 'Buy' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        city: ${{ inputs.city != '' && fromJSON(format('["{0}"]', inputs.city)) || fromJSON('["Porto","Matosinhos","Vila Nova de Gaia","Maia"]') }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ matrix.city }} (buy)
        run: |
          SOURCE=$(echo "${{ inputs.source || 'Imovirtual' }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ matrix.city }}" --type buy

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-buy-${{ matrix.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── Scrape: rent (after buy) ─────────────────────────────────────────────────
  scrape-rent:
    if: ${{ always() && !failure() && (inputs.scraping_type == '' || inputs.scraping_type == 'Rent' || github.event_name == 'schedule') }}
    needs: scrape-buy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        city: ${{ inputs.city != '' && fromJSON(format('["{0}"]', inputs.city)) || fromJSON('["Porto","Matosinhos","Vila Nova de Gaia","Maia"]') }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ matrix.city }} (rent)
        run: |
          SOURCE=$(echo "${{ inputs.source || 'Imovirtual' }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ matrix.city }}" --type rent

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-rent-${{ matrix.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── Extract contract details (after buy + rent) ─────────────────────────────
  extract-contracts:
    if: ${{ always() && !failure() }}
    needs: [scrape-buy, scrape-rent]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Extract contracts (all cities)
        run: python main.py --type contracts

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-contracts
          path: stats-*.json
          if-no-files-found: warn

  # ── Calculate rent estimates (after buy + rent, parallel with contracts) ───
  calculate-estimates:
    if: ${{ always() && !failure() }}
    needs: [scrape-buy, scrape-rent]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Calculate rent estimates (all cities)
        run: python main.py --type estimates

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-estimates
          path: stats-estimates-*.json
          if-no-files-found: warn

  summarise:
    needs: [scrape-buy, scrape-rent, extract-contracts, calculate-estimates]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all stats artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-stats-*
          merge-multiple: true
          path: stats
        continue-on-error: true

      - name: Write job summary
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys

          stats_dir = pathlib.Path("stats")
          all_rows = sorted(
              (json.loads(f.read_text()) for f in stats_dir.glob("stats-*.json")),
              key=lambda r: r.get("city", ""),
          ) if stats_dir.exists() else []

          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "w") as fh:
              if not all_rows:
                  fh.write("## 🏠 Scrape Summary\n\nNo stats available — all city jobs may have failed.\n")
                  sys.exit(0)

              def write_buy_table(fh, rows):
                  if not rows:
                      return
                  total_fetched = sum(r["fetched"] for r in rows)
                  total_rented  = sum(r.get("rented", 0) for r in rows)
                  total_changes = sum(r["price_changes"] for r in rows)
                  fh.write("### 🛒 Buy\n\n")
                  fh.write("| City | Fetched | Rented | Price changes |\n")
                  fh.write("|------|---------|--------|---------------|\n")
                  for r in rows:
                      fh.write(
                          f"| {r['city']} "
                          f"| {r['fetched']} "
                          f"| {r.get('rented', 0)} "
                          f"| {r['price_changes']} |\n"
                      )
                  fh.write("|------|---------|--------|---------------|\n")
                  fh.write(
                      f"| **Total** "
                      f"| **{total_fetched}** "
                      f"| **{total_rented}** "
                      f"| **{total_changes}** |\n\n"
                  )

              def write_rent_table(fh, rows):
                  if not rows:
                      return
                  total_fetched = sum(r["fetched"] for r in rows)
                  total_changes = sum(r["price_changes"] for r in rows)
                  fh.write("### 🔑 Rent\n\n")
                  fh.write("| City | Fetched | Price changes |\n")
                  fh.write("|------|--------:|--------------:|\n")
                  for r in rows:
                      fh.write(
                          f"| {r['city']} "
                          f"| {r['fetched']} "
                          f"| {r['price_changes']} |\n"
                      )
                  fh.write("|------|---------|---------------|\n")
                  fh.write(
                      f"| **Total** "
                      f"| **{total_fetched}** "
                      f"| **{total_changes}** |\n\n"
                  )

              fh.write("## 🏠 Scrape Summary\n\n")
              write_buy_table(fh, [r for r in all_rows if r.get("type") == "buy"])
              write_rent_table(fh, [r for r in all_rows if r.get("type") == "rent"])

              # ── Contract extraction summary ──
              contract_rows = [r for r in all_rows if r.get("type") == "contracts"]
              if contract_rows:
                  fh.write("### 📋 Contract Details\n\n")
                  fh.write("| City | Processed | Extracted | With Rent | With Expiry |\n")
                  fh.write("|------|----------:|----------:|----------:|------------:|\n")
                  for r in contract_rows:
                      fh.write(
                          f"| {r['city']} "
                          f"| {r['processed']} "
                          f"| {r.get('extracted', 0)} "
                          f"| {r.get('with_rent', 0)} "
                          f"| {r.get('with_expiry', 0)} |\n"
                      )
                  t_proc = sum(r["processed"] for r in contract_rows)
                  t_ext = sum(r.get("extracted", 0) for r in contract_rows)
                  t_rent = sum(r.get("with_rent", 0) for r in contract_rows)
                  t_exp = sum(r.get("with_expiry", 0) for r in contract_rows)
                  fh.write("|------|----------|----------|----------|------------|\n")
                  fh.write(
                      f"| **Total** "
                      f"| **{t_proc}** "
                      f"| **{t_ext}** "
                      f"| **{t_rent}** "
                      f"| **{t_exp}** |\n\n"
                  )

              # ── Rent estimates summary ──
              est_rows = sorted(
                  (json.loads(f.read_text()) for f in stats_dir.glob("stats-estimates-*.json")),
                  key=lambda r: r.get("city", ""),
              ) if stats_dir.exists() else []
              if est_rows:
                  fh.write("### 📊 Rent Estimates\n\n")
                  fh.write("| City | Estimates updated |\n")
                  fh.write("|------|------------------:|\n")
                  for r in est_rows:
                      fh.write(f"| {r['city']} | {r.get('computed', 0)} |\n")
                  total_est = sum(r.get("computed", 0) for r in est_rows)
                  fh.write("|------|-------------------|\n")
                  fh.write(f"| **Total** | **{total_est}** |\n\n")
          EOF
