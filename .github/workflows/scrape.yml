name: Scrape

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source"
        required: true
        default: "Both"
        type: choice
        options:
          - Both
          - Imovirtual
          - ERA
      scraping_type:
        description: "Scraping type (leave empty to scrape both)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Buy"
          - "Rent"
      city:
        description: "City to scrape (leave empty to scrape all cities in parallel)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Porto"
          - "Matosinhos"
          - "Vila Nova de Gaia"
          - "Maia"
          - "Paços de Ferreira"
          - "Penafiel"
          - "Paredes"
          - "Ermesinde"
          - "Alfena"

jobs:
  # ── Migrate database ────────────────────────────────────────────────────────
  migrate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5


    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

  # ── Scrape: buy ──────────────────────────────────────────────────────────────
  scrape-buy:
    needs: migrate
    if: ${{ inputs.scraping_type == '' || inputs.scraping_type == 'Buy' || github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        source: ${{ (inputs.source == 'Imovirtual' && fromJSON('["imovirtual"]')) || (inputs.source == 'ERA' && fromJSON('["era"]')) || fromJSON('["imovirtual","era"]') }}
        city: ${{ inputs.city != '' && fromJSON(format('["{0}"]', inputs.city)) || fromJSON('["Porto","Matosinhos","Vila Nova de Gaia","Maia","Paços de Ferreira","Penafiel","Paredes","Ermesinde","Alfena"]') }}


    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.city }} (buy)
        run: |
          python main.py --source "${{ matrix.source }}" --city "${{ matrix.city }}" --type buy

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-stats-buy-${{ matrix.source }}-${{ matrix.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── Scrape: rent (after buy) ─────────────────────────────────────────────────
  scrape-rent:
    if: ${{ always() && !failure() && (inputs.scraping_type == '' || inputs.scraping_type == 'Rent' || github.event_name == 'schedule') }}
    needs: scrape-buy
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        source: ${{ (inputs.source == 'Imovirtual' && fromJSON('["imovirtual"]')) || (inputs.source == 'ERA' && fromJSON('["era"]')) || fromJSON('["imovirtual","era"]') }}
        city: ${{ inputs.city != '' && fromJSON(format('["{0}"]', inputs.city)) || fromJSON('["Porto","Matosinhos","Vila Nova de Gaia","Maia","Paços de Ferreira","Penafiel","Paredes","Ermesinde","Alfena"]') }}


    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.city }} (rent)
        run: |
          python main.py --source "${{ matrix.source }}" --city "${{ matrix.city }}" --type rent

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-stats-rent-${{ matrix.source }}-${{ matrix.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── Extract contract details (after buy + rent) ─────────────────────────────
  extract-contracts:
    if: ${{ always() && !failure() }}
    needs: [scrape-buy, scrape-rent]
    runs-on: ubuntu-26.04
    timeout-minutes: 30


    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract contracts (all cities)
        run: python main.py --type contracts

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-stats-contracts
          path: stats-*.json
          if-no-files-found: warn

  # ── Calculate rent estimates (after buy + rent, parallel with contracts) ───
  calculate-estimates:
    if: ${{ always() && !failure() }}
    needs: [scrape-buy, scrape-rent]
    runs-on: ubuntu-26.04
    timeout-minutes: 30


    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Calculate rent estimates (all cities)
        run: python main.py --type estimates

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-stats-estimates
          path: stats-estimates-*.json
          if-no-files-found: warn

  summarise:
    needs: [scrape-buy, scrape-rent, extract-contracts, calculate-estimates]
    if: always()
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Download all stats artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: scrape-stats-*
          merge-multiple: true
          path: stats
        continue-on-error: true

      - name: Write job summary
        run: python3 -m yieldhunter.pipeline.stats stats
