name: Scrape

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source"
        required: true
        default: "Imovirtual"
        type: choice
        options:
          - Imovirtual
      city:
        description: "City to scrape (leave empty to scrape all cities in parallel)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Porto"
          - "Matosinhos"
          - "Vila Nova de Gaia"
          - "Maia"

jobs:
  # ── When a specific city is chosen, run a single job for that city ──────────
  scrape-single:
    if: ${{ inputs.city != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ inputs.city }}
        run: |
          SOURCE=$(echo "${{ inputs.source }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ inputs.city }}"

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-${{ inputs.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── When no city is chosen, fan out: one job per city, all in parallel ──────
  scrape-all:
    if: ${{ inputs.city == '' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false          # let other cities finish even if one fails
      matrix:
        city:
          - Porto
          - Matosinhos
          - Vila Nova de Gaia
          - Maia

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ matrix.city }}
        run: |
          SOURCE=$(echo "${{ inputs.source || 'Imovirtual' }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ matrix.city }}"

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-stats-${{ matrix.city }}
          path: stats-*.json
          if-no-files-found: warn

  # ── Wait for all city jobs then write a Markdown summary to the Actions UI ──
  summarise:
    needs: [scrape-single, scrape-all]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all stats artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-stats-*
          merge-multiple: true   # all stats-*.json land flat in ./stats/
          path: stats
        continue-on-error: true  # graceful if every city job was skipped/failed

      - name: Write job summary
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys

          stats_dir = pathlib.Path("stats")
          rows = sorted(
              (json.loads(f.read_text()) for f in stats_dir.glob("stats-*.json")),
              key=lambda r: r["city"],
          ) if stats_dir.exists() else []

          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "w") as fh:
              if not rows:
                  fh.write("## 🏠 Scrape Summary\n\nNo stats available — all city jobs may have failed.\n")
                  sys.exit(0)

              total_fetched = sum(r["fetched"] for r in rows)
              total_rented  = sum(r["rented"]  for r in rows)
              total_changes = sum(r["price_changes"] for r in rows)

              fh.write("## 🏠 Scrape Summary\n\n")
              fh.write("| City | Fetched | Rented | Price changes |\n")
              fh.write("|------|--------:|-------:|--------------:|\n")
              for r in rows:
                  fh.write(
                      f"| {r['city']} "
                      f"| {r['fetched']} "
                      f"| {r['rented']} "
                      f"| {r['price_changes']} |\n"
                  )
              fh.write("|------|--------:|-------:|--------------:|\n")
              fh.write(
                  f"| **Total** "
                  f"| **{total_fetched}** "
                  f"| **{total_rented}** "
                  f"| **{total_changes}** |\n"
              )
          EOF

