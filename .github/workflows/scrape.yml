name: Scrape

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source"
        required: true
        default: "Imovirtual"
        type: choice
        options:
          - Imovirtual
      city:
        description: "City to scrape (leave empty to scrape all cities in parallel)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "Porto"
          - "Matosinhos"
          - "Vila Nova de Gaia"
          - "Maia"

jobs:
  # ── When a specific city is chosen, run a single job for that city ──────────
  scrape-single:
    if: ${{ inputs.city != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ inputs.city }}
        run: |
          SOURCE=$(echo "${{ inputs.source }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ inputs.city }}"

  # ── When no city is chosen, fan out: one job per city, all in parallel ──────
  scrape-all:
    if: ${{ inputs.city == '' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false          # let other cities finish even if one fails
      matrix:
        city:
          - Porto
          - Matosinhos
          - Vila Nova de Gaia
          - Maia

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Scrape ${{ matrix.city }}
        run: |
          SOURCE=$(echo "${{ inputs.source || 'Imovirtual' }}" | tr '[:upper:]' '[:lower:]')
          python main.py --source "$SOURCE" --city "${{ matrix.city }}"
