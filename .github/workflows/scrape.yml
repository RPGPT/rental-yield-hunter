name: Scrape

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Scraper source"
        required: true
        default: "imovirtual"
        type: choice
        options:
          - imovirtual

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - run: python main.py --source ${{ inputs.source || 'imovirtual' }}
