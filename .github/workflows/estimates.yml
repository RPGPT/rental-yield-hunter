name: Refresh Rent Estimates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 5 * * 1"  # every Monday at 05:00 UTC
  workflow_dispatch:

jobs:
  refresh-estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        city:
          - Porto
          - Matosinhos
          - Vila Nova de Gaia
          - Maia

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Refresh estimates for ${{ matrix.city }}
        run: python main.py --type estimates --city "${{ matrix.city }}"

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimates-stats-${{ matrix.city }}
          path: stats-estimates-*.json
          if-no-files-found: warn

  summarise:
    needs: refresh-estimates
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all stats artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: estimates-stats-*
          merge-multiple: true
          path: stats
        continue-on-error: true

      - name: Write job summary
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys

          stats_dir = pathlib.Path("stats")
          all_rows = sorted(
              (json.loads(f.read_text()) for f in stats_dir.glob("stats-estimates-*.json")),
              key=lambda r: r.get("city", ""),
          ) if stats_dir.exists() else []

          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "w") as fh:
              if not all_rows:
                  fh.write("## 📊 Rent Estimates\n\nNo stats available.\n")
                  sys.exit(0)

              total = sum(r.get("computed", 0) for r in all_rows)
              fh.write("## 📊 Rent Estimates Summary\n\n")
              fh.write("| City | Estimates updated |\n")
              fh.write("|------|------------------:|\n")
              for r in all_rows:
                  fh.write(f"| {r['city']} | {r.get('computed', 0)} |\n")
              fh.write("|------|-------------------|\n")
              fh.write(f"| **Total** | **{total}** |\n")
          EOF
